id: protein-pancakes
title: Protein-Pancakes mit Quark und Heidelbeeren
description: Fluffige Pancakes aus Haferflocken, Magerquark und Ei – lassen sich gut vorbacken und einfrieren.
servings: 2
prepMinutes: 10
cookMinutes: 15
mealTypes: [breakfast]
storage: { kind: prep, fridgeDays: 3, freezable: true }
tags: [high-protein, vegetarisch]
sources:
  - https://eatsmarter.de/rezepte/protein-pancakes-mit-magerquark
  - https://www.kitchenstories.com/quark-haferflocken-pancakes/145969
ingredients:
  - { ingredient: haferflocken, amount: 80, unit: g }
  - { ingredient: magerquark, amount: 250, unit: g }
  - { ingredient: eier, amount: 2, unit: stk }
  - { ingredient: milch-fettarm, amount: 50, unit: ml }
  - { ingredient: backpulver, amount: 5, unit: g }
  - { ingredient: rapsoel, amount: 1, unit: el }
  - { ingredient: heidelbeeren-tk, amount: 100, unit: g }
steps:
  - Haferflocken im Mixer fein mahlen.
  - Quark, Eier, Milch, Backpulver und eine Prise Zimt dazugeben und zu einem dicken Teig mixen. 5 Minuten quellen lassen.
  - Etwas Öl in einer beschichteten Pfanne erhitzen und pro Pancake 2 Esslöffel Teig hineingeben.
  - Bei mittlerer Hitze von jeder Seite etwa 2 Minuten goldbraun backen.
  - Mit aufgetauten Heidelbeeren servieren. Zum Vorkochen abkühlen lassen und mit Backpapier dazwischen in eine Box legen.
