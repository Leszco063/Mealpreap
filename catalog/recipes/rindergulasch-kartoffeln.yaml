id: rindergulasch-kartoffeln
title: Rindergulasch mit Kartoffeln
description: Langsam geschmortes Gulasch mit viel Zwiebel und Paprika, dazu Salzkartoffeln.
servings: 4
prepMinutes: 20
cookMinutes: 100
mealTypes: [lunch, dinner]
storage: { kind: prep, fridgeDays: 4, freezable: true }
tags: [klassiker, high-protein]
sources:
  - https://www.essen-und-trinken.de/rezepte/43098-rzpt-gulasch-mit-kartoffeln
  - https://eatsmarter.de/rezepte/smartes-rindergulasch-grundrezept
ingredients:
  - { ingredient: rindergulasch, amount: 800, unit: g }
  - { ingredient: zwiebel, amount: 3, unit: stk }
  - { ingredient: paprika-rot, amount: 1, unit: stk }
  - { ingredient: tomatenmark, amount: 40, unit: g }
  - { ingredient: knoblauch, amount: 2, unit: stk, note: Zehen }
  - { ingredient: rapsoel, amount: 2, unit: el }
  - { ingredient: gemuesebruehe, amount: 5, unit: g }
  - { ingredient: kartoffeln, amount: 1000, unit: g }
steps:
  - Fleisch trocken tupfen, Zwiebeln in Streifen, Paprika in Würfel schneiden.
  - Fleisch portionsweise im Öl kräftig anbraten und herausnehmen. Zwiebeln im Bratfett 8 Minuten goldbraun braten.
  - Tomatenmark und 2 EL Paprikapulver kurz mitrösten, Fleisch, Paprika, Knoblauch, Brühpulver und 600 ml Wasser zugeben.
  - Zugedeckt bei kleiner Hitze etwa 90 Minuten schmoren, bis das Fleisch zart ist. Mit Kümmel, Salz und Pfeffer abschmecken.
  - Kartoffeln schälen und in Salzwasser 20 Minuten garen. Mit dem Gulasch portionieren; zum Einfrieren Kartoffeln lieber frisch dazu kochen.
